<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Redirection…</title>
<script>
  // Liens directs vers Roster (application à une page) : on repasse par roster/index.html.
  (function () {
    var base = "/mon-espace/roster";
    var path = location.pathname;
    if (path.indexOf(base + "/") === 0) {
      var rest = path.slice(base.length + 1);
      var q = new URLSearchParams(location.search);
      location.replace(base + "/?__p=" + encodeURIComponent(rest + (q.toString() ? "?" + q.toString() : "")) + location.hash);
    } else {
      location.replace("/mon-espace/");
    }
  })();
</script>
</head>
<body></body>
</html>
